<html lang="ru"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <title>3.2. Таблица умножения</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        table {
            border-collapse: collapse;
            text-align: center;
        }

        th, td {
            border: 1px solid #777;
            width: 40px;
            height: 35px;
        }

        th {
            background-color: #e0e0e0;
            font-weight: bold;
        }

        .diagonal {
            background-color: #e3f2fd;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Таблица умножения</h2>
    <div id="mult-table"><table><tbody><tr><th>*</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th></tr><tr><th>1</th><td class="diagonal">1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td></tr><tr><th>2</th><td>2</td><td class="diagonal">4</td><td>6</td><td>8</td><td>10</td><td>12</td><td>14</td><td>16</td><td>18</td><td>20</td></tr><tr><th>3</th><td>3</td><td>6</td><td class="diagonal">9</td><td>12</td><td>15</td><td>18</td><td>21</td><td>24</td><td>27</td><td>30</td></tr><tr><th>4</th><td>4</td><td>8</td><td>12</td><td class="diagonal">16</td><td>20</td><td>24</td><td>28</td><td>32</td><td>36</td><td>40</td></tr><tr><th>5</th><td>5</td><td>10</td><td>15</td><td>20</td><td class="diagonal">25</td><td>30</td><td>35</td><td>40</td><td>45</td><td>50</td></tr><tr><th>6</th><td>6</td><td>12</td><td>18</td><td>24</td><td>30</td><td class="diagonal">36</td><td>42</td><td>48</td><td>54</td><td>60</td></tr><tr><th>7</th><td>7</td><td>14</td><td>21</td><td>28</td><td>35</td><td>42</td><td class="diagonal">49</td><td>56</td><td>63</td><td>70</td></tr><tr><th>8</th><td>8</td><td>16</td><td>24</td><td>32</td><td>40</td><td>48</td><td>56</td><td class="diagonal">64</td><td>72</td><td>80</td></tr><tr><th>9</th><td>9</td><td>18</td><td>27</td><td>36</td><td>45</td><td>54</td><td>63</td><td>72</td><td class="diagonal">81</td><td>90</td></tr><tr><th>10</th><td>10</td><td>20</td><td>30</td><td>40</td><td>50</td><td>60</td><td>70</td><td>80</td><td>90</td><td class="diagonal">100</td></tr></tbody></table></div>

    <script>
        // 3.2
        function makeMultTable(){
            let table="<table><tr><th>*</th>";

            // добавляет верхнюю строчку с цифрами от 1 до 10
            for (let j=1;j<=10;j++){
                table+="<th>"+j+"</th>";
            }
            table+="</tr>";

            // строит строки таблицы
            for (let i=1;i<=10;i++){
                table+="<tr>";
                // ставит цифру в левую колонку
                table+="<th>"+i+"</th>";

                // считает и вставляет произведение
                for (let j=1;j<=10;j++){
                    // подсвечивает диагональ, если i равно j
                    let cls=(i===j) ? " class='diagonal'" : "";
                    table+="<td"+cls+">"+(i*j)+"</td>";
                }
                table+="</tr>";
            }

            table+="</table>";

            // выводит таблицу в блок
            document.getElementById("mult-table").innerHTML=table;
        }

        makeMultTable();
    </script>

</body></html>
